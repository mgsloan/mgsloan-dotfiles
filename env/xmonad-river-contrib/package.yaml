name:         xmonad-river-contrib
version:      0.1.0
synopsis:     xmonad-contrib modules reimplemented against river
description:  |
  The counterpart of @xmonad-contrib@ for @xmonad-river@: the community
  modules a configuration imports, reimplemented over river's window
  management protocol.

  Split out from @xmonad-river@ for the same reason upstream splits them —
  the core protocol layer should not have to change when a contrib module
  does, and configs depend on a stable core with a churnier contrib.
author:       Michael Sloan
maintainer:   Michael Sloan
license:      BSD3
license-file: LICENSE

dependencies:
  - base
  - bytestring
  - containers
  - data-default-class
  - directory
  - filepath
  - mtl
  - process
  - unix
  - xmonad-river

default-extensions:
  - FlexibleContexts
  - FlexibleInstances
  - LambdaCase
  - MultiParamTypeClasses
  - RankNTypes
  - ScopedTypeVariables
  - TupleSections
  - TypeApplications

ghc-options:
  - -Wall
  - -Wcompat
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wredundant-constraints

library:
  source-dirs: src

tests:
  contrib-spec:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - xmonad-river-contrib
