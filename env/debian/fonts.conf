<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <dir>/usr/share/fonts/truetype/hack</dir>
  <dir>/usr/share/fonts/truetype/dejavu</dir>
  <dir>/usr/share/fonts/truetype/noto</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <include>/etc/fonts/conf.d/10-scale-bitmap-fonts.conf</include>
  <alias><family>monospace</family><prefer><family>Hack</family></prefer></alias>
</fontconfig>
