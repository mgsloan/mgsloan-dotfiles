[package]
name = "penrose-config"
version = "0.1.0"
edition = "2024"

# vendor/penrose is a fork, carried as a submodule: this config drives both of
# its backends and the river one does not exist upstream. Moving to a newer
# penrose is a commit in that submodule.
# One config, two backends, one per binary: `Conn` is a single type that every
# binding, hook and query in this config names, so a build picks a side. Penrose's
# own backend features are additive and could both be on; these cannot, and
# main.rs says so with a compile_error rather than letting the aliases collide.
#
# The river build drops the parts of this config that are X11 by substance rather
# than by accident -- EWMH, and placement by window property -- and drops x11rb
# with them.
[features]
default = ["x11"]
x11 = ["penrose/x11rb"]
river = ["penrose/river"]

[dependencies]
jiff = "0.2.35"
penrose = { path = "vendor/penrose", default-features = false }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3.4.0"

[[bin]]
name = "penrose-wm"
path = "src/main.rs"
