[package]
name = "errlog-filter"
default-run = "errlog-filter"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
license = "BSD-3-Clause"

[dependencies]
jiff = "0.2"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[build-dependencies]
pkg-config = "0.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
