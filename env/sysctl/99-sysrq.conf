# Magic SysRq: enable every function.
#
# 1 is not a bitmask, it is the kernel's "all of them". Debian's default is
# 438, which leaves out 0x40 -- signalling of processes -- so sysrq-e and
# sysrq-i are refused and REISUB silently degrades to R-S-U-B. Nothing is ever
# asked to terminate, so a frozen session is reset with every running program's
# unsaved work still in it. See readme.md for the time that happened.
#
# All of them also turns on 0x8, the debugging dumps, which is what makes the
# next freeze diagnosable rather than merely survivable: sysrq-w for blocked
# tasks, sysrq-t for every task's state, sysrq-l for backtraces. They go to the
# kernel log, so they are in `journalctl -b -1` after the reboot.
kernel.sysrq = 1
