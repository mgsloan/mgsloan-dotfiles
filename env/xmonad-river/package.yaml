name:         xmonad-river
version:      0.1.0
synopsis:     xmonad's window manager API, implemented over the river Wayland protocols
description:  |
  A reimplementation of the parts of @xmonad@ and @xmonad-contrib@ needed to
  run an xmonad configuration as a river window manager, speaking
  @river-window-management-v1@ and @river-xkb-bindings-v1@ instead of X11.
author:       Michael Sloan
maintainer:   Michael Sloan
license:      BSD3
license-file: LICENSE

# Wayland's wire format is host-endian and 32-bit aligned, which is exactly
# what store-core's Poke/Peek do natively. Note this is store-core rather than
# store: only the Data.Store.Core primitives are used (store's derived
# instances are not wire compatible with Wayland), and store-core's dependency
# footprint is a single module over deps already in this config's closure,
# which keeps the M-q rebuild loop fast.
dependencies:
  - base
  - bytestring
  - containers
  - data-default-class
  - exceptions
  - directory
  - filepath
  - mtl
  - network
  - process
  - store-core
  - transformers
  - unix

default-extensions:
  - FlexibleContexts
  - FlexibleInstances
  - LambdaCase
  - MultiParamTypeClasses
  - RankNTypes
  - ScopedTypeVariables
  - TupleSections
  - TypeApplications

ghc-options:
  - -Wall
  - -Wcompat
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wredundant-constraints

library:
  source-dirs: src

executables:
  # A port of river's reference window manager, used to prove the protocol
  # stack end to end without involving any of the xmonad compatibility layer.
  tinyrwm-hs:
    main: Main.hs
    source-dirs: app/tinyrwm
    dependencies:
      - xmonad-river
    ghc-options:
      - -threaded
      - -rtsopts

tests:
  wire-spec:
    main: Spec.hs
    source-dirs: test
    dependencies:
      - xmonad-river
